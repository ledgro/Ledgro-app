name: Android APK

# Builds the Ledgro Android app: a Capacitor app (the web code bundled inside, plus native Google sign-in).
# - push a tag like v1.0.0  -> signed APK is attached to a GitHub Release
# - run it by hand          -> signed APK is kept as a 7 day download
# Secrets used (nothing else): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# GOOGLE_SERVICES_JSON_BASE64 (optional; Firebase google-services.json, needed for Google sign-in in the app)
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    # a manual run from another branch could read the signing key
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # attach the APK to the release
      id-token: write        # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode signing key (outside the workspace)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          [ -n "$KEYSTORE_BASE64" ] || { echo "Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ledgro.keystore"
          chmod 600 "$RUNNER_TEMP/ledgro.keystore"

      - name: Show the signing key fingerprints (paste these into Firebase)
        env:
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          keytool -list -v -keystore "$RUNNER_TEMP/ledgro.keystore" -alias ledgro -storepass "$KSP" | grep -E 'SHA1:|SHA256:' | sed 's/^ *//' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Version from the tag (or the run number for a manual run)
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$NAME" >> "$GITHUB_ENV"

      - name: Build the web app and copy it into the Android project
        run: |
          set -eu
          npm ci
          npm run build
          npx cap sync android

      - name: Firebase config (for Google sign-in)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -eu
          # accepts the raw file contents or the base64 of it (pasting the raw text works fine from a phone)
          if [ -n "$GSJ" ]; then
            case "$GSJ" in "{"*) printf '%s' "$GSJ" > android/app/google-services.json;; *) printf '%s' "$GSJ" | base64 -d > android/app/google-services.json;; esac
            node -e 'JSON.parse(require("fs").readFileSync("android/app/google-services.json","utf8"))' && echo "google-services.json written"
          else echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: Google sign-in will not work in this APK"; fi

      - name: Build signed APK
        working-directory: android
        env:
          LEDGRO_KEYSTORE: ${{ runner.temp }}/ledgro.keystore
          LEDGRO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEDGRO_VERSION_NAME: ${{ env.APP_VERSION }}
          LEDGRO_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -eu
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../ledgro-${APP_VERSION}.apk"

      - name: Check the APK is signed with the key listed in assetlinks.json
        run: |
          set -eu
          # keytool only reads old-style (v1) signatures; the Gradle build signs with v2/v3, so ask apksigner
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs "ledgro-${APP_VERSION}.apk" | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          [ -n "$GOT" ] || { echo "APK is not signed"; exit 1; }
          WANT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/.well-known/assetlinks.json","utf8"))[0].target.sha256_cert_fingerprints.join(" "))')
          echo "APK key: $GOT"
          case " $WANT " in *" $GOT "*) echo "Matches assetlinks.json";; *) echo "MISMATCH: assetlinks.json has: $WANT"; exit 1;; esac
          echo "APK key $GOT matches assetlinks.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ledgro.keystore"

      - name: Provenance (proves this APK came from this repo)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ledgro-${{ env.APP_VERSION }}.apk

      - name: Attach to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ledgro-${{ env.APP_VERSION }}.apk
          generate_release_notes: true

      - name: Keep as a download (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ledgro-apk
          path: ledgro-${{ env.APP_VERSION }}.apk
          retention-days: 7
