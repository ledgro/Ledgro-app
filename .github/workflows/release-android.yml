name: Android APK

# Builds the Ledgro Android app (a Trusted Web Activity: it opens https://ledgro-app.pages.dev).
# - push a tag like v1.0.0  -> signed APK is attached to a GitHub Release
# - run it by hand          -> signed APK is kept as a 7 day download
# Secrets used (nothing else): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    # a manual run from another branch could read the signing key
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # attach the APK to the release
      id-token: write        # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing key (outside the workspace)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          [ -n "$KEYSTORE_BASE64" ] || { echo "Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ledgro.keystore"
          chmod 600 "$RUNNER_TEMP/ledgro.keystore"

      - name: Android SDK for Bubblewrap (standard layout, own copy)
        run: |
          set -eu
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -r "$ANDROID_HOME/cmdline-tools/latest/." "$SDK/cmdline-tools/latest/"
          # Bubblewrap only checks for a bin folder at the SDK root; Gradle wants the standard layout
          ln -s cmdline-tools/latest/bin "$SDK/bin"
          ln -s cmdline-tools/latest/lib "$SDK/lib"   # the sdkmanager script loads its jars from ../lib
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          yes | "$SDKM" --sdk_root="$SDK" "platforms;android-36" "platform-tools" > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --list_installed
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$SDK" > "$HOME/.bubblewrap/config.json"

      - name: Version from the tag (or the run number for a manual run)
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.${GITHUB_RUN_NUMBER}"; fi
          node -e '
            const fs=require("fs"); const m=JSON.parse(fs.readFileSync("twa-manifest.json","utf8"));
            m.appVersion=process.argv[1]; m.appVersionCode=Number(process.argv[2]);
            m.signingKey.path=process.argv[3];
            fs.writeFileSync("twa-manifest.json",JSON.stringify(m,null,2));
          ' "$NAME" "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/ledgro.keystore"
          echo "APP_VERSION=$NAME" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          # the runner also sets ANDROID_SDK_ROOT to its own SDK; Gradle refuses two different paths
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          npx --yes @bubblewrap/cli@1.27.0 update --skipVersionUpgrade
          npx --yes @bubblewrap/cli@1.27.0 build --skipPwaValidation
          mv app-release-signed.apk "ledgro-${APP_VERSION}.apk"

      - name: Check the APK is signed with the key listed in assetlinks.json
        run: |
          set -eu
          GOT=$(keytool -printcert -jarfile "ledgro-${APP_VERSION}.apk" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          WANT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/.well-known/assetlinks.json","utf8"))[0].target.sha256_cert_fingerprints.join(" "))')
          echo "APK key: $GOT"
          case " $WANT " in *" $GOT "*) echo "Matches assetlinks.json";; *) echo "MISMATCH: assetlinks.json has: $WANT"; exit 1;; esac
          echo "APK key $GOT matches assetlinks.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ledgro.keystore"

      - name: Provenance (proves this APK came from this repo)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ledgro-${{ env.APP_VERSION }}.apk

      - name: Attach to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ledgro-${{ env.APP_VERSION }}.apk
          generate_release_notes: true

      - name: Keep as a download (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ledgro-apk
          path: ledgro-${{ env.APP_VERSION }}.apk
          retention-days: 7
