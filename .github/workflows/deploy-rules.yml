name: Deploy Firestore rules

# Publishes firestore.rules to Firebase whenever it changes on main (after the rules tests pass).
# One-time setup: add the repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON key,
# roles "Firebase Rules Admin" + "Service Usage Consumer"). Until the secret exists this workflow fails safely and changes nothing.

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
  workflow_dispatch:

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx -y firebase-tools@15.34.1 deploy --only firestore:rules --project getledgro-2afec --non-interactive
