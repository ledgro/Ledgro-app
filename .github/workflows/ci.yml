name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older run, so a burst of pushes never queues up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # dummy value: the build only needs the variable to exist, not to be valid
          VITE_FIREBASE_API_KEY: ci-placeholder

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm/_npx
          key: firebase-tools-15.34.1-${{ runner.os }}
      - run: npm ci
      - run: npm run test:rules
