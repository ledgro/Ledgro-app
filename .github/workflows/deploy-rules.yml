name: Deploy Firestore rules

# Publishes firestore.rules to Firebase whenever it changes on main (after the rules tests pass).
# One-time setup: add the repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON key,
# roles "Firebase Rules Admin" + "Service Usage Consumer"). Until the secret exists this workflow fails safely and changes nothing.

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
  workflow_dispatch:

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  deploy:
    # a manual run from any other branch could reach the service-account secret
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm/_npx
          key: firebase-tools-15.34.1-${{ runner.os }}
      - run: npm ci
      # the rules tests gate the deploy: if they fail, nothing is published
      - run: npm run test:rules
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx -y firebase-tools@15.34.1 deploy --only firestore:rules --project getledgro-2afec --non-interactive
